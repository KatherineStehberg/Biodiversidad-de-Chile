name: QA — Playwright · Cypress · Cucumber

on:
  workflow_dispatch:
  push:
    branches: [qa-automation-course]
  pull_request:
    branches: [qa-automation-course]

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_USE_MOCK_DATA: "true"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-mock-anon-key"
      NEXTAUTH_SECRET: "ci-mock-nextauth-secret"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium de Playwright con dependencias Linux
        run: npx playwright install chromium --with-deps

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Iniciar servidor Next.js
        run: npm run start &

      - name: Esperar servidor
        run: |
          echo "Esperando http://localhost:3000..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Servidor listo en intento $i"
              exit 0
            fi
            sleep 3
          done
          echo "Error: servidor no respondió después de 90 segundos"
          exit 1

      - name: Ejecutar Playwright
        run: npx playwright test

      - name: Ejecutar Cypress
        run: npx cypress run

      - name: Ejecutar Cucumber
        run: npx cucumber-js

      - name: Subir artefactos Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Subir reporte Playwright si existe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Subir capturas Cypress si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Subir videos Cypress si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 7
          if-no-files-found: ignore

      - name: Cerrar servidor
        if: always()
        run: pkill -f "next" || true
