name: QA — Static · Playwright · Cypress · Cucumber · Docker

on:
  push:
    branches:
      - qa-automation-course
      - 'review/**'
  pull_request:
    branches:
      - main
      - qa-automation-course
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_USE_MOCK_DATA: "true"
  NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-mock-anon-key"
  NEXTAUTH_SECRET: "ci-mock-nextauth-secret"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
  static-analysis:
    name: TypeScript and ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Validate ESLint
        run: npm run lint

  browser-and-api-tests:
    name: Playwright, Cypress and Cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium with Linux dependencies
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: npm run build

      - name: Start Next.js server
        run: npm run start > /tmp/biodiversidad-next.log 2>&1 &

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              echo "Server ready on attempt $i"
              exit 0
            fi
            sleep 3
          done
          echo "Server did not respond after 90 seconds"
          cat /tmp/biodiversidad-next.log || true
          exit 1

      - name: Run Playwright
        run: npm run test:playwright

      - name: Run Cypress
        run: npm run test:cypress

      - name: Run Cucumber
        run: npm run test:cucumber

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Cypress videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Next.js server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-server-log
          path: /tmp/biodiversidad-next.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Next.js server
        if: always()
        run: pkill -f "next" || true

  docker-smoke-test:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag biodiversidad-qa:ci .

      - name: Start container
        run: docker run --detach --name biodiversidad-qa --publish 3000:3000 biodiversidad-qa:ci

      - name: Wait for container
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              echo "Container ready on attempt $i"
              exit 0
            fi
            sleep 3
          done
          echo "Container did not respond after 90 seconds"
          docker logs biodiversidad-qa || true
          exit 1

      - name: Stop container
        if: always()
        run: docker rm --force biodiversidad-qa || true
